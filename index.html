// ============================================================
// カメラ（ランダムにアングルを切り替える）
// ============================================================
// 各アングルは自車からの相対位置。ds: 道なり前後, dl: 左右, y: 航路からの高さ（t〜 は注視点）
// side: 左右どちらから撮るか (±1), u: そのアングルになってからの秒数（ゆっくり動かす用）
const CAM_MODES = [
  { name: '後方', w: 3, f: (side, u) => ({ ds: -11, dl: 0, y: 3.2, tds: 12, tdl: 0, ty: 0.9 }) },
  { name: '正面', w: 1.5, needFront: true, f: (side, u) => ({ ds: 10 - u * 0.12, dl: side * 0.6, y: 1.5, tds: 0, tdl: 0, ty: 0.7 }) },
  { name: '斜め前', w: 2, needFront: true, f: (side, u) => ({ ds: 8 - u * 0.15, dl: side * 4.2, y: 2.0, tds: 0, tdl: 0, ty: 0.7 }) },
  { name: '斜め後ろ', w: 2, f: (side, u) => ({ ds: -9, dl: side * (4.5 - u * 0.12), y: 2.4, tds: 5, tdl: 0, ty: 0.8 }) },
  { name: '斜め上空', w: 2, f: (side, u) => ({ ds: -30 + u * 0.7, dl: side * 8, y: 32 - u * 0.3, tds: 16, tdl: -side * 1.5, ty: 0 }) },
  { name: '真上', w: 1, f: (side, u) => ({ ds: -6, dl: side * 2, y: 36 + u * 0.6, tds: 18, tdl: 0, ty: 0 }) },
  // 機体の下から見上げる（頭上の広告とネオンが入る）
  { name: 'ローアングル', w: 1.5, f: (side, u) => ({ ds: -8, dl: side * 1.8, y: -2.5, tds: 22, tdl: 0, ty: 3.5 }) },
];
const CUT_P = 0.45;              // 切り替えがカット（瞬時）になる確率。残りはなめらかに移動
const BLEND_T = 2.2;             // なめらかな移動にかける秒数

let camLat = player.lat, camAlt = player.alt;
const cam = { cur: null, prev: null, side: 1, prevSide: 1, u: 0, prevU: 0, blend: 1, left: 0 };
const focusP = new THREE.Vector3();
const _cp = new THREE.Vector3(), _ct = new THREE.Vector3(), _pp = new THREE.Vector3(), _pt = new THREE.Vector3();

function frontIsClear() {
  const L = leaderOf(player);
  return !L || L.gap > 16;
}
const camLatOf = (o) => THREE.MathUtils.clamp(camLat + o.dl, -CAM_LAT_MAX, CAM_LAT_MAX);
// カメラがどれかの機体に埋まるか（上下を飛ぶ機体も含む）
function camBlocked(mode, side, u) {
  const o = mode.f(side, u), cs = player.s + o.ds, cl = camLatOf(o), cy = camAlt + o.y;
  for (const v of vehicles) {
    if (v.isPlayer || v.straight) continue;
    if (cy > v.alt - 1 && cy < v.alt + v.height + 0.8 &&
      Math.abs(v.s - cs) < v.len / 2 + 2.5 && Math.abs(v.lat - cl) < v.wid / 2 + 0.8) return true;
  }
  for (const c of ceilings) {
    if (Math.abs(c.s - cs) < 3 && ALT + cy > c.bottom - 0.5 && ALT + cy < c.top + 0.5) return true;
  }
  // 横切る空中道路の機体（向きが直角なので、前後と左右の広がりが入れ替わる）
  for (const c of crossings) {
    for (const car of c.cars) {
      const alt = c.alt + car.dy;
      if (cy > alt - 1 && cy < alt + car.height + 0.8 &&
        Math.abs(c.s + car.off - cs) < car.wid / 2 + 2.5 && Math.abs(car.u - cl) < car.len / 2 + 0.8) return true;
    }
  }
  return false;
}
function switchCamera(cut) {
  const side = chance(0.5) ? 1 : -1;
  let pool = CAM_MODES.filter((m) => m !== cam.cur && (!m.needFront || frontIsClear()) && !camBlocked(m, side, 0));
  if (!pool.length) pool = [CAM_MODES[0]];
  let r = Math.random() * pool.reduce((a, m) => a + m.w, 0), next = pool[0];
  for (const m of pool) { r -= m.w; if (r <= 0) { next = m; break; } }
  applyCamera(next, side, cut);
}
function applyCamera(next, side, cut) {
  cam.prev = cam.cur; cam.prevSide = cam.side; cam.prevU = cam.u;
  cam.cur = next; cam.side = side; cam.u = 0;
  cam.blend = cut || !cam.prev ? 1 : 0;
  cam.left = DEMO ? rand(8, 12) : rand(20, 30);
}
// 名前でアングルを指定する。使えない状況なら fallback を順に試す
function setCamera(names, cut) {
  const side = chance(0.5) ? 1 : -1;
  for (const name of names) {
    const m = CAM_MODES.find((x) => x.name === name);
    if ((m.needFront && !frontIsClear()) || camBlocked(m, side, 0)) continue;
    applyCamera(m, side, cut);
    return;
  }
  applyCamera(CAM_MODES[0], 1, cut);
}

// PV のカメラ割り（自車の位置 s で切り替える）
const PV_CAMS = [
  { s: 0, cams: ['後方'], cut: true },
  { s: 230, cams: ['斜め上空', '後方'] },                       // 航路とビルの谷を見下ろす
  { s: 480, cams: ['ローアングル', '斜め後ろ'], cut: true },     // 頭上の広告を見上げる
  { s: 680, cams: ['斜め前', '正面', '斜め後ろ'], cut: true },
  { s: 880, cams: ['真上', '斜め上空'] },
  { s: 1060, cams: ['斜め後ろ', '後方'], cut: true },
  { s: 1240, cams: ['正面', '斜め前', '後方'], cut: true },
  { s: 1420, cams: ['斜め上空', '後方'] },
];
let pvCamIdx = 0;

function camPose(mode, side, u, pos, tgt) {
  const o = mode.f(side, u);
  sample(player.s + o.ds, camLatOf(o), P);
  pos.set(P.x, ALT + camAlt + o.y, P.z);
  sample(player.s + o.tds, camLat + o.tdl, P);
  tgt.set(P.x, ALT + camAlt + o.ty, P.z);
}
function updateCamera(dt, t) {
  camLat += (player.lat - camLat) * (1 - Math.exp(-3 * dt));
  camAlt += (player.alt - camAlt) * (1 - Math.exp(-2 * dt));
  if (!cam.cur) switchCamera(true);
  cam.u += dt; cam.prevU += dt;
  cam.left -= dt;
  if (PV) {
    while (pvCamIdx < PV_CAMS.length && player.s >= PV_CAMS[pvCamIdx].s) {
      const c = PV_CAMS[pvCamIdx++];
      setCamera(c.cams, c.cut);
    }
  } else if (params.autoCam && cam.left <= 0) switchCamera(chance(CUT_P));
  if (cam.cur !== CAM_MODES[0] && camBlocked(cam.cur, cam.side, cam.u)) switchCamera(true);

  camPose(cam.cur, cam.side, cam.u, _cp, _ct);
  if (cam.blend < 1) {
    cam.blend = Math.min(1, cam.blend + dt / BLEND_T);
    const k = THREE.MathUtils.smootherstep(cam.blend, 0, 1);
    camPose(cam.prev, cam.prevSide, cam.prevU, _pp, _pt);
    _cp.lerpVectors(_pp, _cp, k);
    _ct.lerpVectors(_pt, _ct, k);
  }
  camera.position.copy(_cp);
  camera.position.y += Math.sin(t * 1.3) * 0.04;
  camera.lookAt(_ct);
  ground.position.set(Math.round(camera.position.x / GROUND_TILE) * GROUND_TILE, 0, Math.round(camera.position.z / GROUND_TILE) * GROUND_TILE);
  // 霧の層も、模様がずれないようにタイル単位でカメラについていく
  const hazeTile = HAZE_SIZE / HAZE_REPEAT;
  haze.position.set(Math.round(camera.position.x / hazeTile) * hazeTile, 0, Math.round(camera.position.z / hazeTile) * hazeTile);
  hazeTex.offset.x = (hazeTex.offset.x + dt * 0.004) % 1;   // ゆっくり流す
}
addEventListener('keydown', (e) => {
  if (typing(e)) return;
  if (e.key === 'c' || e.key === 'C') switchCamera(false);
});


// エリアの境目から 120m かけて、霧と環境光を次のエリアに寄せる
const _ca = new THREE.Color();
const areaEl = document.getElementById('area');
let areaShown = null, areaTimer = 0;
function updateArea(dt) {
  const z = zoneAt(player.s), i = zones.indexOf(z), prev = zones[i - 1];
  const a = AREAS[prev ? prev.type : z.type], b = AREAS[z.type];
  const k = prev ? THREE.MathUtils.smoothstep(player.s - z.s0, 0, 120) : 1;
  scene.fog.color.set(a.fog).lerp(_ca.set(b.fog), k);
  scene.fog.density = THREE.MathUtils.lerp(a.density, b.density, k) * params.fog / 0.0055;
  scene.background.copy(scene.fog.color).multiplyScalar(0.7);
  hemi.color.set(a.sky).lerp(_ca.set(b.sky), k);
  hemi.groundColor.set(a.ground).lerp(_ca.set(b.ground), k);
  hemi.intensity = THREE.MathUtils.lerp(a.hemi, b.hemi, k);
  const hz = THREE.MathUtils.lerp(a.haze || 0, b.haze || 0, k);
  haze.visible = hz > 0.01;
  hazeMat.opacity = 0.16 * hz;
  hazeMat.color.copy(scene.fog.color).multiplyScalar(1.15);
  // 新しいエリアに入ったら名前を出す。デモではカメラも切り替える
  if (pv.started && z !== areaShown) {
    areaShown = z;
    if (params.area !== z.type) { params.area = z.type; areaCtrl.updateDisplay(); }
    if (!PV) {
      areaEl.innerHTML = `${b.name}<small>${b.en}</small>`;
      areaEl.style.textShadow = `0 0 18px ${b.glow}, 0 0 4px #000`;
      areaEl.style.opacity = 1;
      areaTimer = 4;
    }
    if (DEMO && i > 0) switchCamera(true);
    // 録画では画面に重ねたエリア名が写らないので、切り替わった時刻を記録して、変換のときに焼き込む
    if (REC) areaLog.push({ t: (performance.now() - recStart) / 1000, name: b.name, en: b.en });
  }
  if (areaTimer > 0 && (areaTimer -= dt) <= 0) areaEl.style.opacity = 0;
}

// 広告のちらつき、パトカーの回転灯、航空障害灯、フレアスタックの炎
const flicker = MAT.ads.map(() => 0);
function updateAmbient(dt, t) {
  MAT.ads.forEach((m, i) => {
    if (flicker[i] > 0) {
      flicker[i] -= dt;
      m.color.setScalar(chance(0.5) ? 0.25 : 1.4);
    } else {
      m.color.setScalar(1.4);
      if (chance(dt * 0.12)) flicker[i] = rand(0.08, 0.35);
    }
  });
  MAT.holos.forEach((m, i) => { m.opacity = 0.6 + 0.15 * Math.sin(t * 3 + i) - (flicker[i] > 0 ? 0.4 : 0); });
  const ph = (t * 4) % 2 < 1;
  MAT.polRed.color.setRGB(ph ? 5 : 0.3, 0.05, 0.05);
  MAT.polBlue.color.setRGB(0.05, 0.2, ph ? 0.3 : 5);
  MAT.airPts.opacity = (t % 1.6) < 0.5 ? 1 : 0.08;
  lensPass.uniforms.time.value = t;
  MAT.flame.color.setScalar(0.75 + Math.random() * 0.5);
}

// ---- エリア移動: 自車の後ろ（BEHIND）から先を、選んだエリアで作り直す
// s から先の街を作り直す（すでに作ってあるチャンクを捨てて、区間の変更を反映させる）
function rebuildFrom(s) {
  const cut = Math.max(0, Math.floor(s / CHUNK) * CHUNK);   // チャンクの境目で切る
  for (const [k, c] of chunks) if (k * CHUNK >= cut) { disposeChunk(c); chunks.delete(k); }
  // まだ作っていない所から始まる列はそのまま。作ってあった列は cut まで戻す
  for (const side of [-1, 1]) bCursor[side] = bCursor[side].map((b) => Math.min(b, cut));
  for (const list of [adLights, smokeEmitters, footprints, ceilings]) {
    for (let i = list.length - 1; i >= 0; i--) if (list[i].s >= cut) list.splice(i, 1);
  }
  updateChunks(player.s);
}
// すぐに移動する: 自車の後ろ（BEHIND）から先を、選んだエリアにする
function jumpToArea(type) {
  const cut = Math.max(0, Math.floor((player.s - BEHIND) / CHUNK) * CHUNK);
  while (zones.length && zones[zones.length - 1].s0 >= cut) zones.pop();
  if (zones.length) zones[zones.length - 1].s1 = cut;
  zones.push({ type, s0: cut, s1: Math.max(cut, player.s) + (FIXED_ORDER ? DEMO_LEN : rand(700, 1300)) });
  rebuildFrom(cut);
}
// 次の移動先を決める: 今のエリアが終わったら、選んだエリアに入る
function setNextArea(type) {
  const z = zoneAt(player.s);
  zones.length = zones.indexOf(z) + 1;
  zones.push({ type, s0: z.s1, s1: z.s1 + (FIXED_ORDER ? DEMO_LEN : rand(700, 1300)) });
  rebuildFrom(z.s1);
}
const AREA_CHOICES = Object.fromEntries(AREA_ORDER.map((a) => [AREAS[a].name, a]));
params.area = START_AREA;
const areaCtrl = gui.add(params, 'area', AREA_CHOICES).name('エリアへ移動（1〜4）').onChange(jumpToArea);
addEventListener('keydown', (e) => {
  if (typing(e)) return;
  const i = Number(e.key) - 1;
  if (!GATED && i >= 0 && i < AREA_ORDER.length) { params.area = AREA_ORDER[i]; areaCtrl.updateDisplay(); jumpToArea(AREA_ORDER[i]); }
});

// ---- PV: クリックでフェードインして開始、最後はフェードアウト
// 暗転は画面に板を重ねず露出で行う（録画に写るように）
const FADE_T = 2;
const pv = { started: !GATED, ended: false, fade: GATED ? 0 : 1, fadeTo: GATED ? 0 : 1, onEnd: null };
const pvmsg = document.getElementById('pvmsg');
function startPV() {
  pv.started = true;
  pv.startedAt = performance.now();
  pv.fadeTo = 1;
  pvmsg.style.opacity = 0;
  if (PV) document.body.classList.add('pv-running');
}
const autoStart = REC || SNAP.length > 0;
if (GATED) {
  gui.hide();
  document.getElementById('hud').style.display = 'none';
  if (!autoStart) {
    pvmsg.textContent = DEMO ? 'クリックでデモ開始' : 'クリックで再生';
    pvmsg.style.display = 'flex';
  }
  addEventListener('pointerdown', () => {
    if (autoStart) return;
    if (!pv.started) startPV();
    else if (pv.ended) location.reload();
  });
}
function updatePV(dt) {
  pv.fade += THREE.MathUtils.clamp(pv.fadeTo - pv.fade, -dt / FADE_T, dt / FADE_T);
  renderer.toneMappingExposure = params.exposure * pv.fade;
  const done = PV ? player.s >= PV_END : DEMO && REC && zones.indexOf(zoneAt(player.s)) >= AREA_ORDER.length;
  if (!pv.started || pv.ended || !done) return;
  pv.ended = true;
  pv.fadeTo = 0;
  if (snd.ctx) snd.master.gain.setTargetAtTime(0, snd.ctx.currentTime, 0.7);
  setTimeout(() => {
    if (pv.onEnd) { pv.onEnd(); return; }
    pvmsg.textContent = 'クリックでもう一度';
    pvmsg.style.opacity = 1;
    pvmsg.style.display = 'flex';
    document.body.classList.remove('pv-running');
  }, 2500);
}

// ---- 録画: canvas の映像と、全体の音を MediaRecorder で録る
const areaLog = [];   // 録画の開始からの秒数と、エリア名
let recStart = 0;
async function startRecording() {
  initAudio();
  await snd.ctx.resume();
  const dest = snd.ctx.createMediaStreamDestination();
  snd.master.connect(dest);
  const stream = new MediaStream([
    ...renderer.domElement.captureStream(30).getVideoTracks(),
    ...dest.stream.getAudioTracks(),
  ]);
  // 後で ffmpeg で H.264 に変換するので、ここは画質優先で高めのビットレート
  const rec = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9,opus', videoBitsPerSecond: 12e6, audioBitsPerSecond: 192000 });
  const chunksRec = [];
  rec.ondataavailable = (e) => { if (e.data.size) chunksRec.push(e.data); };
  rec.onstop = async () => {
    const name = DEMO ? 'demo' : 'pv';
    await fetch(`/save?name=${name}_areas.json`, { method: 'POST', body: JSON.stringify(areaLog) });
    const res = await fetch(`/save?name=${name}_raw.webm`, { method: 'POST', body: new Blob(chunksRec, { type: 'video/webm' }) });
    document.title = res.ok ? 'REC_DONE' : 'REC_FAILED';
  };
  pv.onEnd = () => rec.stop();
  rec.start(1000);
  recStart = performance.now();
  startPV();
}
// ビルなどの生成とシェーダーのコンパイルが落ち着くのを待ってから始める
if (REC) setTimeout(startRecording, 2000);
else if (GATED && SNAP.length) setTimeout(startPV, 2000);

const hud = document.getElementById('hud');

const menu = document.getElementById('menu');

function openMenu(anchor, title, items) {
  menu.replaceChildren();

  head.className = 'title'; head.textContent = title;
  menu.append(head);
  for (const it of items) {
    const row = document.createElement('div');
    row.className = 'item' + (it.cur ? ' cur' : '');
    const name = document.createElement('span');
    name.textContent = it.label;
    row.append(name);
    row.addEventListener('click', (e) => { e.stopPropagation(); closeMenu(); it.onClick(); });
    if (it.extra) {
      const b = document.createElement('span');
      b.className = 'now'; b.textContent = it.extra.label;
      b.addEventListener('click', (e) => { e.stopPropagation(); closeMenu(); it.extra.onClick(); });
      row.append(b);
    }
    menu.append(row);
  }
  const r = anchor.getBoundingClientRect();
  menu.style.left = `${r.left}px`;
  menu.style.bottom = `${innerHeight - r.top + 6}px`;
  menu.style.display = 'block';
}
function closeMenu() { menu.style.display = 'none'; }
addEventListener('pointerdown', (e) => { if (!menu.contains(e.target) && !e.target.classList.contains('hud-btn')) closeMenu(); });
// カメラ: 選んだアングルで固定する。「自動で切り替え」で元に戻る

  })));
});
const LANE_NAMES = ['第1航路', '第2航路', '第3航路'];
let last = performance.now(), t = 0, hudT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const sdt = pv.started ? dt : 0;    // PV は開始まで止めておく
  t += sdt;

  for (const v of vehicles) updateVehicle(v, sdt, t);
  updateCrossings(sdt, t);
  manageTraffic(sdt);
  updateChunks(player.s);
  updateAdLights();
  updateCamera(sdt, t);
  updateRain(sdt);
  updatePV(dt);
  updateSound();
  updateAmbient(sdt, t);
  updateArea(dt);
  updateSmoke(sdt);

  focusP.copy(player.group.position); focusP.y += 0.8;
  bokehPass.uniforms.focus.value = camera.position.distanceTo(focusP);

  hudT -= dt;
  if (hudT <= 0) {
    hudT = 0.2;
    const sig = player.blinkDir < 0 ? ' ◀' : player.blinkDir > 0 ? ' ▶' : '';
    hudEl.Speed.textContent = Math.round(player.speed * 3.6);
    hudEl.Area.textContent = AREAS[areaAt(player.s)].name;
    hudEl.Lane.textContent = LANE_NAMES[player.lane] + sig;
    hudEl.Cam.textContent = `📷 ${params.autoCam ? '' : '固定: '}${cam.cur.name}`;
    hudEl.Sound.textContent = !snd.ctx ? '🔈 クリックで音が鳴ります' : snd.muted ? '🔇 M で音を戻す' : '🔊 M でミュート';
  }

  composer.render(dt);
  maybeSnap(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener('resize', () => {
  if (REC) return;
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
